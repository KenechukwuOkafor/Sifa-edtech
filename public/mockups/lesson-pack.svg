<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A generated Sifa lesson pack for Photosynthesis, showing its five materials, the curriculum objectives covered, and the sources it is grounded in">
  <rect width="960" height="600" rx="14" fill="#F8FAFC"/>

  <!-- header -->
  <rect x="0" y="0" width="960" height="96" rx="14" fill="#312E81"/>
  <rect x="0" y="82" width="960" height="14" fill="#312E81"/>
  <text x="40" y="44" font-family="Inter, sans-serif" font-size="11" fill="#A0A9E6">GENERATED LESSON PACK · BASIC SCIENCE · JSS 2</text>
  <text x="40" y="72" font-family="Sora, Inter, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">Photosynthesis</text>
  <rect x="742" y="34" width="178" height="28" rx="14" fill="#FFFFFF" opacity=".14"/>
  <text x="760" y="53" font-family="Inter, sans-serif" font-size="11" fill="#E0E3F7">Aligned to scheme of work</text>

  <!-- five artefact cards -->
  <g font-family="Sora, Inter, sans-serif" font-size="13" font-weight="600" fill="#272563">
    <rect x="40" y="132" width="168" height="200" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="40" y="132" width="168" height="4" rx="2" fill="#312E81"/>
    <text x="60" y="170">Lesson plan</text>

    <rect x="228" y="132" width="168" height="200" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="228" y="132" width="168" height="4" rx="2" fill="#464BAD"/>
    <text x="248" y="170">Slides</text>

    <rect x="416" y="132" width="168" height="200" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="416" y="132" width="168" height="4" rx="2" fill="#5A63C7"/>
    <text x="436" y="170">Quiz</text>

    <rect x="604" y="132" width="168" height="200" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="604" y="132" width="168" height="4" rx="2" fill="#F08423"/>
    <text x="624" y="170">Homework</text>

    <rect x="792" y="132" width="128" height="200" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="792" y="132" width="128" height="4" rx="2" fill="#D96A18"/>
    <text x="812" y="170">Marking</text>
  </g>

  <!-- card contents -->
  <g font-family="Inter, sans-serif" font-size="10" fill="#64748B">
    <!-- lesson plan -->
    <text x="60" y="199">1. Learning objectives</text>
    <text x="60" y="219">2. Starter activity</text>
    <text x="60" y="239">3. Main teaching</text>
    <text x="60" y="259">4. Class practical</text>
    <text x="60" y="279">5. Plenary &amp; recap</text>

    <!-- slides: the block stays a slide thumbnail -->
    <rect x="248" y="192" width="128" height="52" rx="4" fill="#E2E8F0"/>
    <text x="248" y="263">14 slides</text>
    <text x="248" y="283">Diagrams included</text>

    <!-- quiz -->
    <text x="436" y="199">Q1. Word equation</text>
    <text x="436" y="219">Q2. Role of chlorophyll</text>
    <text x="436" y="247">Q3. Limiting factors</text>
    <text x="436" y="267">Q4. Leaf adaptations</text>
    <text x="436" y="295">10 questions</text>

    <!-- homework -->
    <text x="624" y="199">Draw and label a leaf</text>
    <text x="624" y="219">Explain the equation</text>
    <text x="624" y="239">Practical write-up</text>
    <text x="624" y="259">Due: next lesson</text>

    <!-- marking guide -->
    <text x="812" y="199">Model answers</text>
    <text x="812" y="219">Mark scheme</text>
    <text x="812" y="239">Total: 20 marks</text>
    <text x="812" y="259">Grade bands</text>
  </g>

  <!-- objectives panel -->
  <rect x="40" y="360" width="560" height="196" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="64" y="392" font-family="Inter, sans-serif" font-size="11" fill="#64748B">CURRICULUM OBJECTIVES COVERED</text>
  <g font-family="Inter, sans-serif" font-size="12" fill="#334155">
    <circle cx="72" cy="422" r="6" fill="#F08423"/>
    <text x="90" y="426">Describe photosynthesis in green plants</text>
    <circle cx="72" cy="454" r="6" fill="#F08423"/>
    <text x="90" y="458">State the word equation for the process</text>
    <circle cx="72" cy="486" r="6" fill="#F08423"/>
    <text x="90" y="490">Identify leaf structures and their adaptations</text>
    <circle cx="72" cy="518" r="6" fill="#F08423"/>
    <text x="90" y="522">Explain factors that limit the rate</text>
  </g>

  <!-- source panel -->
  <rect x="620" y="360" width="300" height="196" rx="10" fill="#EEF0FB"/>
  <text x="644" y="392" font-family="Inter, sans-serif" font-size="11" fill="#3B3D8F">GROUNDED IN</text>
  <g font-family="Inter, sans-serif" font-size="12" fill="#312E81">
    <text x="644" y="424">WAEC syllabus</text>
    <text x="644" y="452">NECO syllabus</text>
    <text x="644" y="480">NERDC scheme of work</text>
    <text x="644" y="508">Past examination papers</text>
  </g>
