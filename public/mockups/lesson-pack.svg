<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Placeholder mockup of a generated Sifa lesson pack">
  <rect width="960" height="600" rx="14" fill="#F8FAFC"/>

  <!-- header -->
