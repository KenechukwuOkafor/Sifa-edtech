    <rect x="60" y="232" width="118" height="8" rx="4"/><rect x="60" y="252" width="92" height="8" rx="4"/>
    <rect x="60" y="272" width="112" height="8" rx="4"/>

    <rect x="248" y="192" width="128" height="52" rx="4"/><rect x="248" y="256" width="96" height="8" rx="4"/>
    <rect x="248" y="276" width="112" height="8" rx="4"/>

    <rect x="436" y="192" width="128" height="8" rx="4"/><rect x="436" y="212" width="104" height="8" rx="4"/>
    <rect x="436" y="240" width="128" height="8" rx="4"/><rect x="436" y="260" width="88" height="8" rx="4"/>
