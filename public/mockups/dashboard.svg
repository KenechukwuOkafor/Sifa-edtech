<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Placeholder mockup of the Sifa dashboard">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#1A1842"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" rx="14" fill="#F8FAFC"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="212" height="600" rx="14" fill="url(#sky)"/>
  <rect x="212" y="0" width="14" height="600" fill="url(#sky)"/>
  <text x="32" y="52" font-family="Sora, Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Sifa</text>
  <g fill="#FFFFFF" opacity=".16">
    <rect x="24" y="92" width="164" height="34" rx="8" opacity=".9"/>
    <rect x="24" y="136" width="164" height="34" rx="8"/>
    <rect x="24" y="180" width="164" height="34" rx="8"/>
    <rect x="24" y="224" width="164" height="34" rx="8"/>
    <rect x="24" y="268" width="164" height="34" rx="8"/>
  </g>
  <g fill="#C4CAF0" font-family="Inter, sans-serif" font-size="12">
    <text x="40" y="114">Dashboard</text><text x="40" y="158">Lesson packs</text>
    <text x="40" y="202">Scheme of work</text><text x="40" y="246">My classes</text>
    <text x="40" y="290">Settings</text>
  </g>

  <!-- top bar -->
  <rect x="226" y="0" width="734" height="72" fill="#FFFFFF"/>
  <line x1="226" y1="72" x2="960" y2="72" stroke="#E2E8F0" stroke-width="1"/>
  <text x="258" y="44" font-family="Sora, Inter, sans-serif" font-size="17" font-weight="600" fill="#272563">Lesson packs</text>
  <rect x="760" y="22" width="150" height="30" rx="8" fill="#F08423"/>
  <text x="778" y="42" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">New lesson pack</text>

  <!-- stat tiles -->
  <g>
    <rect x="258" y="102" width="212" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="278" y="132" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Packs this term</text>
    <text x="278" y="164" font-family="Sora, Inter, sans-serif" font-size="26" font-weight="600" fill="#312E81">—</text>

    <rect x="486" y="102" width="212" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="506" y="132" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Scheme coverage</text>
    <text x="506" y="164" font-family="Sora, Inter, sans-serif" font-size="26" font-weight="600" fill="#312E81">—</text>

    <rect x="714" y="102" width="196" height="86" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="734" y="132" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Hours saved</text>
    <text x="734" y="164" font-family="Sora, Inter, sans-serif" font-size="26" font-weight="600" fill="#312E81">—</text>
  </g>

  <!-- table -->
  <rect x="258" y="212" width="652" height="344" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <line x1="258" y1="252" x2="910" y2="252" stroke="#E2E8F0"/>
  <g font-family="Inter, sans-serif" font-size="11" fill="#64748B">
    <text x="280" y="238">Topic</text><text x="520" y="238">Subject</text>
    <text x="650" y="238">Class</text><text x="760" y="238">Status</text>
  </g>
  <g>
    <g fill="#E2E8F0">
      <rect x="280" y="272" width="196" height="10" rx="5"/><rect x="520" y="272" width="88" height="10" rx="5"/>
      <rect x="650" y="272" width="56" height="10" rx="5"/>
      <rect x="280" y="320" width="168" height="10" rx="5"/><rect x="520" y="320" width="96" height="10" rx="5"/>
      <rect x="650" y="320" width="56" height="10" rx="5"/>
      <rect x="280" y="368" width="212" height="10" rx="5"/><rect x="520" y="368" width="76" height="10" rx="5"/>
      <rect x="650" y="368" width="56" height="10" rx="5"/>
      <rect x="280" y="416" width="180" height="10" rx="5"/><rect x="520" y="416" width="104" height="10" rx="5"/>
      <rect x="650" y="416" width="56" height="10" rx="5"/>
      <rect x="280" y="464" width="152" height="10" rx="5"/><rect x="520" y="464" width="84" height="10" rx="5"/>
      <rect x="650" y="464" width="56" height="10" rx="5"/>
    </g>
    <g>
      <rect x="760" y="266" width="72" height="22" rx="11" fill="#FFF8ED"/><text x="774" y="281" font-family="Inter, sans-serif" font-size="10" fill="#B45015">Ready</text>
      <rect x="760" y="314" width="72" height="22" rx="11" fill="#EEF0FB"/><text x="774" y="329" font-family="Inter, sans-serif" font-size="10" fill="#3B3D8F">Draft</text>
      <rect x="760" y="362" width="72" height="22" rx="11" fill="#FFF8ED"/><text x="774" y="377" font-family="Inter, sans-serif" font-size="10" fill="#B45015">Ready</text>
      <rect x="760" y="410" width="72" height="22" rx="11" fill="#FFF8ED"/><text x="774" y="425" font-family="Inter, sans-serif" font-size="10" fill="#B45015">Ready</text>
      <rect x="760" y="458" width="72" height="22" rx="11" fill="#EEF0FB"/><text x="774" y="473" font-family="Inter, sans-serif" font-size="10" fill="#3B3D8F">Draft</text>
    </g>
  </g>

  <!-- placeholder watermark -->
  <rect x="258" y="566" width="196" height="20" rx="10" fill="#FEF3C7"/>
  <text x="270" y="580" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#92400E">PLACEHOLDER MOCKUP</text>
</svg>
